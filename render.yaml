services:
  - type: web
    name: codelingo-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true   # Render auto-generates a secure random value
    disk:
      name: sqlite-data
      mountPath: /data
      sizeGB: 1
